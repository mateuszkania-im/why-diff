name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { node: [20, 22] }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: standalone bundle is committed and up to date
        run: npm run check:bundle
      - run: npm run build:lib
      - name: smoke (bundle has no runtime dependencies)
        run: |
          mkdir -p /tmp/smoke && cp plugin/bin/why-diff.mjs /tmp/smoke/
          node /tmp/smoke/why-diff.mjs --version
          node /tmp/smoke/why-diff.mjs --help
