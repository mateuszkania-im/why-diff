name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22]
        include:
          - { os: windows-latest, node: 22 }
    steps:
      # Windows runners convert to CRLF on checkout; .gitattributes pins LF too, this covers git itself.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: standalone bundle is committed and up to date
        run: npm run check:bundle
      - run: npm run build:lib
      - name: smoke (bundle has no runtime dependencies)
        shell: bash
        run: |
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke" && cp plugin/bin/why-diff.mjs "$smoke/"
          node "$smoke/why-diff.mjs" --version
          node "$smoke/why-diff.mjs" --help
